<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <link rel="icon" href="{{ "favicon.png" | relURL }}" type="image/png">
    {{ with resources.Get "css/main.css" | minify | fingerprint }}
      <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
    {{ end }}
    {{ with site.Home.OutputFormats.Get "RSS" }}
      <link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .Permalink }}">
    {{ end }}
    <script>
      MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="site-header">
      <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
      <nav aria-label="サイトナビゲーション">
        <a href="{{ site.Home.RelPermalink }}">トップ</a>
        {{ with site.Home.OutputFormats.Get "RSS" }}<a href="{{ .RelPermalink }}">RSS</a>{{ end }}
      </nav>
    </header>
    <main id="main" class="container">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <p>Author: <a href="https://github.com/{{ site.Params.author }}">{{ site.Params.author }}</a> / <a href="https://github.com/kaityo256/log/blob/main/LICENSE">CC-BY</a></p>
    </footer>
  </body>
</html>
